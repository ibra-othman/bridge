<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BRIDGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Sora:wght@400;600;800&display=swap" rel="stylesheet">

</head>
<body>
<div class="bg" aria-hidden="true">

    <svg class="sh spin" viewBox="0 0 40 40" style="--x:30%;--y:80%;--s:36px;--d:15s;--dl:-9s;--c:var(--ac)"><rect x="6" y="6" width="28" height="28" rx="4"/></svg>

    <svg class="sh pls" viewBox="0 0 40 40" style="--x:82%;--y:32%;--s:34px;--d:13s;--dl:-2s;--c:var(--ac2)"><circle cx="20" cy="20" r="14"/><circle cx="20" cy="20" r="5"/></svg>

  <svg class="arc" viewBox="0 0 1440 220" preserveAspectRatio="none"><path class="flow" d="M0 210C300 40 520 40 720 120S1140 200 1440 30"/><path class="flow f2" d="M0 190C320 70 540 70 740 140S1120 190 1440 70"/></svg>
</div>
<header>
  <div class="logo" onclick="go('home')" role="link" tabindex="0">
    <svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><path d="M1 20V9C1 9 7 2 15 2s14 7 14 7v11" fill="none" stroke="#22d3ee" stroke-width="2.4"/><path d="M8 20v-9M15 20V4M22 20v-9" stroke="#6366f1" stroke-width="2"/></svg>BRIDGE
  </div>
  <nav id="nav"></nav>
  <div class="tools2">
    <button class="btn ghost sm" id="tourBtn" onclick="startTour()"></button>
    <button class="btn ghost sm" id="accBtn" onclick="openAccount()"></button>
    <button class="btn ghost sm" id="langBtn" onclick="toggleLang()"></button>
    <button class="btn ghost sm" id="resetBtn" onclick="askReset()"></button>
  </div>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
